<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
  <!-- Phase 8A-2 rev 2 mockup: view from the LOBBY CENTRE, eye (0,164,420), looking north (-z), level.
       Key positions are projected with a pinhole model: x = 600 + 600*dx/d, y = 300 - 600*dy/d, d = 420 - z
       (about 90 degrees horizontal field of view). Shapes are schematic; positions and heights are consistent with the design doc. -->
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03050b"/><stop offset="0.45" stop-color="#0d1530"/><stop offset="1" stop-color="#18214a"/></linearGradient>
    <linearGradient id="hz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26345e" stop-opacity="0"/><stop offset="1" stop-color="#26345e" stop-opacity="0.55"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#hall)"/>

  <!-- side upper walls (x = ±400): top Y180, bottom Y60 -->
  <polygon points="0,252 307,286 307,374 0,460" fill="#111936"/>
  <polygon points="1200,252 893,286 893,374 1200,460" fill="#111936"/>
  <g stroke="#00e1ff" stroke-opacity="0.3"><line x1="120" y1="265" x2="120" y2="430"/><line x1="230" y1="278" x2="230" y2="396"/><line x1="1080" y1="265" x2="1080" y2="430"/><line x1="970" y1="278" x2="970" y2="396"/></g>
  <polygon points="0,355 307,330 307,333 0,359" fill="#8a2be2" opacity="0.45"/><polygon points="1200,355 893,330 893,333 1200,359" fill="#8a2be2" opacity="0.45"/>
  <!-- far north upper wall (z -400): y 286-374, x 307-893 -->
  <rect x="307" y="286" width="586" height="88" fill="#121a38"/>
  <g stroke="#00e1ff" stroke-opacity="0.3"><line x1="400" y1="286" x2="400" y2="374"/><line x1="500" y1="286" x2="500" y2="374"/><line x1="700" y1="286" x2="700" y2="374"/><line x1="800" y1="286" x2="800" y2="374"/></g>
  <rect x="307" y="330" width="586" height="3" fill="#8a2be2" opacity="0.45"/>
  <g fill="#070b18"><rect x="420" y="296" width="44" height="26"/><rect x="736" y="296" width="44" height="26"/></g>
  <!-- terrace deck (Y60) + plinth top edge (x = ±320) -->
  <polygon points="0,460 307,374 893,374 1200,460 1057,444 859,382 341,382 143,444" fill="#1a2348"/>
  <polyline points="143,444 341,382 859,382 1057,444" fill="none" stroke="#26345e" stroke-width="4"/>
  <!-- terrace machinery towers (tops Y<=150) -->
  <g fill="#141c3c" stroke="#26345e"><rect x="162" y="287" width="46" height="133"/><rect x="958" y="315" width="42" height="95"/><rect x="490" y="311" width="34" height="69"/></g>

  <!-- ceiling ribs to the hub (0,240,0) at y 187 -->
  <g stroke="#1a2348" stroke-width="12" stroke-linecap="round">
    <line x1="29" y1="259" x2="560" y2="187"/><line x1="1171" y1="259" x2="640" y2="187"/>
    <line x1="307" y1="286" x2="575" y2="190"/><line x1="893" y1="286" x2="625" y2="190"/>
    <line x1="600" y1="286" x2="600" y2="192"/>
  </g>
  <g stroke="#1a2348" stroke-width="22" stroke-linecap="round"><line x1="0" y1="0" x2="565" y2="185"/><line x1="1200" y1="0" x2="635" y2="185"/><line x1="600" y1="0" x2="600" y2="182"/></g>
  <ellipse cx="600" cy="187" rx="44" ry="4" fill="none" stroke="#26345e" stroke-width="6"/>
  <rect x="0" y="250" width="1200" height="170" fill="url(#hz)"/>

  <!-- Data Archive vault behind the reactor: x 461-739, top y 397 -->
  <rect x="461" y="397" width="278" height="10" fill="#141c3c"/>
  <!-- Skybridge spires: (190,110,-60) top y 364 x 838 ; (190,92,60) top y 415 x 917 -->
  <rect x="834" y="364" width="8" height="40" fill="#1f2c5c" stroke="#8a2be2" stroke-width="1.2"/>
  <rect x="913" y="390" width="8" height="14" fill="#1f2c5c" stroke="#8a2be2" stroke-width="1.2"/>
  <circle cx="838" cy="361" r="3" fill="#8a2be2"/>
  <text x="852" y="356" fill="#c9d1ea" font-size="11">Skybridge spire tops</text>

  <!-- Reactor: crown y 259-287, coils y 330 / 394, column to the floor cut -->
  <rect x="587" y="287" width="26" height="117" fill="#2a3a6a" opacity="0.6"/>
  <rect x="596" y="287" width="8" height="117" fill="#00e1ff"/>
  <polygon points="584,287 616,287 624,259 576,259" fill="#26345e"/>
  <g fill="#26345e"><polygon points="576,259 570,252 580,259"/><polygon points="624,259 630,252 620,259"/></g>
  <line x1="600" y1="259" x2="600" y2="191" stroke="#00e1ff" stroke-width="2.5"/>
  <g fill="none">
    <ellipse cx="600" cy="330" rx="23" ry="2.5" stroke="#1f2c5c" stroke-width="8"/><ellipse cx="600" cy="330" rx="19" ry="1.5" stroke="#8a2be2" stroke-width="2"/>
    <ellipse cx="600" cy="394" rx="29" ry="5" stroke="#1f2c5c" stroke-width="9"/><ellipse cx="600" cy="394" rx="24" ry="4" stroke="#8a2be2" stroke-width="2"/>
  </g>
  <g stroke="#1f2c5c" stroke-width="5"><line x1="583" y1="394" x2="560" y2="404"/><line x1="617" y1="394" x2="640" y2="404"/></g>
  <text x="640" y="270" fill="#f5f7ff" font-size="13" font-weight="600">SIMULATION CORE: crown Y 190</text>
  <text x="640" y="334" fill="#c9d1ea" font-size="11">coil Y 140</text>
  <text x="640" y="374" fill="#c9d1ea" font-size="11">coil Y 95 (just above the floor line)</text>

  <!-- lobby Wall_N as glass: from the lobby floor edge (y 400) up to the wall top (y 275) -->
  <rect x="0" y="275" width="1200" height="125" fill="#9fdcff" opacity="0.08"/>
  <line x1="0" y1="275" x2="1200" y2="275" stroke="#9fdcff" stroke-opacity="0.6" stroke-width="2"/>
  <g fill="#26345e"><rect x="396" y="275" width="6" height="125"/><rect x="798" y="275" width="6" height="125"/></g>
  <text x="20" y="270" fill="#9aa6c8" font-size="11">Wall_N top (Y 165): glazed, same size / CFrame / CanCollide</text>

  <!-- lobby floor (Y 160) foreground: its front edge at z 396 hides views steeper than ~9.5° from the centre -->
  <polygon points="0,400 1200,400 1200,720 0,720" fill="#2b3557"/>
  <rect x="0" y="398" width="1200" height="4" fill="#00e1ff" opacity="0.85"/>
  <g stroke="#3b4a7a"><line x1="600" y1="400" x2="600" y2="720"/><line x1="300" y1="400" x2="0" y2="560"/><line x1="900" y1="400" x2="1200" y2="560"/></g>
  <text x="600" y="440" fill="#c9d1ea" font-size="12" text-anchor="middle">LOBBY floor (unchanged). Walk to the glass to see down to the plaza, Reservoir, Yard and Archive floors</text>

  <!-- bay canopy (Y 186) edge seen above -->
  <rect x="0" y="0" width="1200" height="18" fill="#1a2348"/>
  <text x="600" y="13" fill="#9aa6c8" font-size="10" text-anchor="middle">bay canopy Y 186 · notch Y 140–180 · "OBSERVATION 01"</text>

  <!-- title -->
  <rect x="16" y="30" width="600" height="50" fill="#05080f" opacity="0.8"/>
  <text x="28" y="52" fill="#f5f7ff" font-size="16" font-weight="700">AFTER — view from the lobby centre (proposed)</text>
  <text x="28" y="70" fill="#9aa6c8" font-size="11">Eye (0,164,420) looking north; projected positions. Cooling towers (x ±150) sit outside this frame.</text>
</svg>
