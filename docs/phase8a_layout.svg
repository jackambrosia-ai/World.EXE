<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" font-family="Segoe UI, Arial, sans-serif">
  <!-- Phase 8A proposed arena layout (top-down, not to exact scale; 1 px ~ 0.8 studs). -Z (north) is up. -->
  <rect width="720" height="760" fill="#0a0f1f"/>
  <text x="360" y="30" fill="#f5f7ff" font-size="18" text-anchor="middle" font-weight="600">WORLD.EXE — Phase 8A proposed arena (top-down)</text>
  <text x="360" y="50" fill="#9aa6c8" font-size="12" text-anchor="middle">Footprint ~520 × 520 studs · tiers: T0 ground Y0 · T1 Y24 · T2 Y48 · T3 Y72 · basin Y−10 · north is up</text>

  <g transform="translate(40,70)">
    <!-- footprint -->
    <rect x="0" y="0" width="640" height="640" fill="#101830" stroke="#26345e" stroke-width="2"/>
    <!-- outer ring route (T1) -->
    <rect x="70" y="70" width="500" height="500" rx="60" fill="none" stroke="#00e1ff" stroke-width="10" stroke-opacity="0.35"/>
    <text x="320" y="88" fill="#00e1ff" font-size="11" text-anchor="middle">OUTER RING ROUTE (T1, 14 wide)</text>

    <!-- spokes (T0 corridors) -->
    <g stroke="#3b4a7a" stroke-width="22">
      <line x1="320" y1="320" x2="320" y2="150"/>
      <line x1="320" y1="320" x2="320" y2="490"/>
      <line x1="320" y1="320" x2="150" y2="320"/>
      <line x1="320" y1="320" x2="490" y2="320"/>
    </g>
    <!-- gantries (T2) -->
    <g stroke="#8a2be2" stroke-width="6" stroke-dasharray="10 6">
      <line x1="320" y1="300" x2="520" y2="300"/>
      <line x1="300" y1="320" x2="300" y2="140"/>
    </g>

    <!-- Data Archive (north) -->
    <rect x="185" y="20" width="270" height="140" fill="#18224a" stroke="#00e1ff" stroke-width="2"/>
    <g fill="#26345e"><rect x="205" y="40" width="10" height="100"/><rect x="240" y="40" width="10" height="100"/><rect x="275" y="40" width="10" height="100"/><rect x="355" y="40" width="10" height="100"/><rect x="390" y="40" width="10" height="100"/><rect x="425" y="40" width="10" height="100"/></g>
    <rect x="292" y="55" width="56" height="56" fill="#1f2c5c" stroke="#00e1ff"/>
    <text x="320" y="178" fill="#f5f7ff" font-size="13" text-anchor="middle" font-weight="600">DATA ARCHIVE (new)</text>
    <text x="320" y="192" fill="#9aa6c8" font-size="10" text-anchor="middle">server-rack canyons · atrium · catwalks T1</text>

    <!-- Coolant Reservoir (south) -->
    <rect x="185" y="480" width="270" height="140" fill="#18224a" stroke="#00e1ff" stroke-width="2"/>
    <rect x="245" y="505" width="150" height="90" rx="8" fill="#123a6a" stroke="#2878ff"/>
    <g fill="#26345e"><circle cx="275" cy="550" r="9"/><circle cx="365" cy="550" r="9"/></g>
    <rect x="415" y="495" width="28" height="110" fill="none" stroke="#5aaaff" stroke-dasharray="4 3"/>
    <text x="320" y="470" fill="#f5f7ff" font-size="13" text-anchor="middle" font-weight="600">COOLANT RESERVOIR (new)</text>
    <text x="320" y="635" fill="#9aa6c8" font-size="10" text-anchor="middle">sunken basin Y−10 · pump towers · cargo lanes · rim walkways</text>

    <!-- Research Yard (west) -->
    <rect x="15" y="200" width="160" height="240" fill="#18224a" stroke="#00e1ff" stroke-width="2"/>
    <g fill="#3a3070" stroke="#4e3f8e">
      <rect x="40" y="250" width="110" height="130" fill="url(#grid)"/>
    </g>
    <text x="95" y="190" fill="#f5f7ff" font-size="13" text-anchor="middle" font-weight="600">RESEARCH YARD</text>
    <text x="95" y="455" fill="#9aa6c8" font-size="10" text-anchor="middle">10×10 DecayTile grid · test chambers</text>

    <!-- Skybridge District (east) -->
    <rect x="465" y="200" width="160" height="240" fill="#18224a" stroke="#8a2be2" stroke-width="2"/>
    <rect x="485" y="250" width="90" height="80" fill="#2a2058" stroke="#8a2be2"/>
    <circle cx="590" cy="235" r="22" fill="#2a2058" stroke="#8a2be2"/>
    <circle cx="590" cy="395" r="22" fill="#2a2058" stroke="#8a2be2"/>
    <text x="545" y="190" fill="#f5f7ff" font-size="13" text-anchor="middle" font-weight="600">SKYBRIDGE DISTRICT</text>
    <text x="545" y="455" fill="#9aa6c8" font-size="10" text-anchor="middle">SkyDeck T2 · floating islands T3</text>

    <!-- Central Core -->
    <circle cx="320" cy="320" r="85" fill="#141c3c" stroke="#00e1ff" stroke-width="2"/>
    <circle cx="320" cy="320" r="55" fill="none" stroke="#00e1ff" stroke-width="6" stroke-opacity="0.5"/>
    <circle cx="320" cy="320" r="22" fill="#8a2be2"/>
    <circle cx="320" cy="320" r="10" fill="#00e1ff"/>
    <text x="320" y="425" fill="#f5f7ff" font-size="13" text-anchor="middle" font-weight="600">CENTRAL CORE</text>
    <text x="320" y="270" fill="#9aa6c8" font-size="10" text-anchor="middle">reactor spire · plaza T0 · mezzanine T1</text>

    <!-- stabilizers -->
    <g fill="#3cdc8c" stroke="#0a0f1f" stroke-width="2">
      <polygon points="320,252 330,262 320,272 310,262"/>
      <polygon points="95,215 105,225 95,235 85,225"/>
      <polygon points="530,280 540,290 530,300 520,290"/>
    </g>
    <!-- lobby -->
    <rect x="270" y="650" width="100" height="16" fill="#26345e" stroke="#9aa6c8"/>
    <text x="320" y="662" fill="#f5f7ff" font-size="9" text-anchor="middle">LOBBY (moved outside bounds, Y160)</text>

    <defs>
      <pattern id="grid" width="11" height="13" patternUnits="userSpaceOnUse">
        <rect width="11" height="13" fill="#3a3070"/>
        <path d="M11 0 L0 0 0 13" fill="none" stroke="#0a0f1f" stroke-width="1"/>
      </pattern>
    </defs>
  </g>

  <!-- legend -->
  <g transform="translate(40,730)" font-size="11" fill="#c9d1ea">
    <polygon points="10,-6 16,0 10,6 4,0" fill="#3cdc8c"/><text x="22" y="4">Stabilizer (3)</text>
    <rect x="120" y="-5" width="24" height="10" fill="#3b4a7a"/><text x="150" y="4">T0 spoke corridor</text>
    <line x1="270" y1="0" x2="300" y2="0" stroke="#8a2be2" stroke-width="4" stroke-dasharray="6 4"/><text x="306" y="4">T2 gantry</text>
    <line x1="380" y1="0" x2="410" y2="0" stroke="#00e1ff" stroke-width="6" stroke-opacity="0.4"/><text x="416" y="4">T1 outer ring</text>
    <rect x="500" y="-5" width="20" height="10" fill="#123a6a" stroke="#2878ff"/><text x="526" y="4">Flood basin</text>
  </g>
</svg>
