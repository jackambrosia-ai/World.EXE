<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1000" font-family="Segoe UI, Arial, sans-serif">
  <!-- Phase 8A-2 mockup: ground-level view from the south edge of the Central Core plaza (camera ~ (0,6,110) looking at the reactor). Schematic, not a render. -->
  <defs>
    <linearGradient id="daysky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1560c9"/><stop offset="1" stop-color="#9cc8e8"/></linearGradient>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080f"/><stop offset="0.6" stop-color="#121a38"/><stop offset="1" stop-color="#26345e"/></linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26345e" stop-opacity="0"/><stop offset="1" stop-color="#26345e" stop-opacity="0.8"/></linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#bff6ff"/><stop offset="0.4" stop-color="#00e1ff"/><stop offset="1" stop-color="#00e1ff" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- ============ BEFORE ============ -->
  <rect x="0" y="0" width="960" height="470" fill="url(#daysky)"/>
  <text x="20" y="30" fill="#ffffff" font-size="18" font-weight="700">BEFORE — current 8A-1 (traced from g1_core_ground.jpg)</text>
  <rect x="0" y="360" width="960" height="110" fill="#5d6f9e"/>
  <line x1="0" y1="360" x2="960" y2="360" stroke="#00e1ff" stroke-width="2"/>
  <!-- thin reactor -->
  <rect x="463" y="40" width="34" height="290" fill="#2f8cf0"/>
  <g fill="none" stroke="#e040fb" stroke-width="10"><ellipse cx="480" cy="80" rx="30" ry="12"/><ellipse cx="480" cy="170" rx="30" ry="12"/><ellipse cx="480" cy="290" rx="30" ry="8"/></g>
  <rect x="455" y="320" width="50" height="40" fill="#2a3a6a"/>
  <!-- slab mezzanine on legs -->
  <rect x="230" y="240" width="500" height="10" fill="#1f2c5c"/><line x1="230" y1="240" x2="730" y2="240" stroke="#e040fb" stroke-width="3"/>
  <g stroke="#1f2c5c" stroke-width="10"><line x1="280" y1="250" x2="265" y2="360"/><line x1="680" y1="250" x2="695" y2="360"/></g>
  <!-- ramp -->
  <polygon points="140,405 560,215 570,225 160,415" fill="#18224a"/>
  <!-- low blocks -->
  <rect x="120" y="320" width="80" height="45" fill="#2a3a6a"/><rect x="760" y="320" width="80" height="45" fill="#2a3a6a"/>
  <g font-size="12" fill="#0a0f1f">
    <text x="510" y="70">thin tube "reactor" (~146)</text>
    <text x="740" y="232">floating slab, no structure</text>
    <text x="40" y="120">open daytime sky = no place</text>
    <text x="40" y="455">no substructure, horizon line = void</text>
  </g>

  <!-- ============ AFTER ============ -->
  <g transform="translate(0,500)">
    <rect x="0" y="0" width="960" height="500" fill="url(#hall)"/>
    <text x="20" y="30" fill="#f5f7ff" font-size="18" font-weight="700">AFTER — proposed 8A-2 (same camera)</text>

    <!-- hall wall far away with seams and violet band -->
    <rect x="0" y="200" width="960" height="180" fill="#141c3c"/>
    <g stroke="#00e1ff" stroke-opacity="0.45" stroke-width="2">
      <line x1="40" y1="200" x2="40" y2="380"/><line x1="140" y1="200" x2="140" y2="380"/><line x1="240" y1="200" x2="240" y2="380"/>
      <line x1="720" y1="200" x2="720" y2="380"/><line x1="820" y1="200" x2="820" y2="380"/><line x1="920" y1="200" x2="920" y2="380"/>
    </g>
    <rect x="0" y="300" width="960" height="5" fill="#8a2be2" opacity="0.6"/>
    <!-- deep windows -->
    <rect x="160" y="230" width="60" height="60" fill="#0a0f1f"/><rect x="740" y="230" width="60" height="60" fill="#0a0f1f"/>
    <!-- ceiling ribs converging to hub -->
    <g stroke="#1f2c5c" stroke-width="14">
      <line x1="0" y1="120" x2="480" y2="20"/><line x1="960" y1="120" x2="480" y2="20"/>
      <line x1="200" y1="200" x2="480" y2="20"/><line x1="760" y1="200" x2="480" y2="20"/>
    </g>
    <ellipse cx="480" cy="22" rx="60" ry="10" fill="none" stroke="#26345e" stroke-width="8"/>
    <!-- rev 2: terrace plinth (Y 60) in front of the set-back upper wall -->
    <rect x="0" y="336" width="960" height="44" fill="#1a2348"/>
    <rect x="0" y="333" width="960" height="4" fill="#26345e"/>
    <g fill="#141c3c"><rect x="60" y="300" width="30" height="33"/><rect x="860" y="296" width="34" height="37"/></g>
    <rect x="0" y="230" width="960" height="150" fill="url(#haze)"/>

    <!-- reactor complex -->
    <polygon points="330,380 430,150 445,155 360,380" fill="#1f2c5c"/>
    <polygon points="630,380 530,150 515,155 600,380" fill="#1f2c5c"/>
    <g stroke="#26345e" stroke-width="2"><line x1="345" y1="330" x2="400" y2="230"/><line x1="615" y1="330" x2="560" y2="230"/></g>
    <rect x="452" y="40" width="56" height="340" fill="#2a3a6a" opacity="0.55" stroke="#9fdcff" stroke-opacity="0.5"/>
    <rect x="470" y="40" width="20" height="340" fill="url(#core)"/>
    <rect x="474" y="40" width="12" height="340" fill="#00e1ff"/>
    <line x1="480" y1="40" x2="480" y2="20" stroke="#00e1ff" stroke-width="4"/>
    <!-- coil rings: navy outer, violet inner -->
    <g>
      <ellipse cx="480" cy="110" rx="70" ry="16" fill="none" stroke="#1f2c5c" stroke-width="16"/>
      <ellipse cx="480" cy="110" rx="62" ry="12" fill="none" stroke="#8a2be2" stroke-width="3"/>
      <ellipse cx="480" cy="200" rx="88" ry="20" fill="none" stroke="#1f2c5c" stroke-width="18"/>
      <ellipse cx="480" cy="200" rx="78" ry="15" fill="none" stroke="#8a2be2" stroke-width="3"/>
      <ellipse cx="480" cy="290" rx="105" ry="22" fill="none" stroke="#1f2c5c" stroke-width="20"/>
      <ellipse cx="480" cy="290" rx="94" ry="17" fill="none" stroke="#8a2be2" stroke-width="3"/>
    </g>
    <!-- crown fins -->
    <g fill="#26345e"><polygon points="440,40 452,40 452,60"/><polygon points="520,40 508,40 508,60"/><rect x="445" y="34" width="70" height="8"/></g>

    <!-- canopy ring + colonnade (open over reactor) -->
    <rect x="80" y="300" width="300" height="12" fill="#26345e"/><rect x="580" y="300" width="300" height="12" fill="#26345e"/>
    <line x1="80" y1="312" x2="380" y2="312" stroke="#00e1ff" stroke-width="2"/><line x1="580" y1="312" x2="880" y2="312" stroke="#00e1ff" stroke-width="2"/>
    <g fill="#1a2348"><rect x="100" y="312" width="12" height="90"/><rect x="200" y="312" width="12" height="90"/><rect x="300" y="312" width="12" height="90"/>
      <rect x="648" y="312" width="12" height="90"/><rect x="748" y="312" width="12" height="90"/><rect x="848" y="312" width="12" height="90"/></g>

    <!-- mezzanine with balustrade and girders under -->
    <rect x="230" y="340" width="500" height="12" fill="#1f2c5c"/>
    <rect x="230" y="326" width="500" height="14" fill="#9fdcff" opacity="0.15"/><line x1="230" y1="326" x2="730" y2="326" stroke="#00e1ff" stroke-width="2"/>
    <g fill="#141c3c"><polygon points="250,352 300,352 280,402 270,402"/><polygon points="660,352 710,352 690,402 680,402"/><polygon points="455,352 505,352 490,402 470,402"/></g>

    <!-- plaza floor with radial inlays and kerb -->
    <polygon points="0,500 0,402 960,402 960,500" fill="#1a2348"/>
    <line x1="0" y1="402" x2="960" y2="402" stroke="#00e1ff" stroke-width="2"/>
    <g stroke="#00e1ff" stroke-opacity="0.35"><line x1="480" y1="402" x2="80" y2="500"/><line x1="480" y1="402" x2="880" y2="500"/><line x1="480" y1="402" x2="480" y2="500"/></g>
    <ellipse cx="480" cy="410" rx="80" ry="8" fill="#00e1ff" opacity="0.18"/>
    <!-- gantry tube (ramp) -->
    <polygon points="140,470 560,330 570,340 160,480" fill="#18224a"/>
    <g stroke="#26345e" stroke-width="3"><line x1="200" y1="455" x2="200" y2="440"/><line x1="280" y1="428" x2="280" y2="413"/><line x1="360" y1="401" x2="360" y2="386"/><line x1="440" y1="374" x2="440" y2="359"/><line x1="520" y1="347" x2="520" y2="332"/></g>

    <g font-size="12" fill="#c9d1ea">
      <text x="560" y="80">reactor crown Y 190, beam to rib hub Y 240</text>
      <text x="590" y="120">3 coil rings (violet inner face only)</text>
      <text x="610" y="160">glass column + cyan energy core</text>
      <text x="40" y="190">ceiling ribs (Y 180–240)</text>
      <text x="20" y="225">upper hall wall ±400 (Y 180), deep windows</text>
      <text x="20" y="352" fill="#9aa6c8">terrace plinth ±320 (Y 60)</text>
      <text x="700" y="296">canopy ring + colonnade (open over pads)</text>
      <text x="20" y="490">plaza = lid of containment pit; radial inlays</text>
    </g>
  </g>
</svg>
