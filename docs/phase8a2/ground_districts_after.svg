<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1000" font-family="Segoe UI, Arial, sans-serif">
  <!-- Phase 8A-2 mockups: ground-level AFTER views matching g3_archive_ground.jpg and g4_reservoir_ground.jpg camera positions. Schematic, not renders. -->
  <defs>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04060c"/><stop offset="1" stop-color="#141c3c"/></linearGradient>
    <linearGradient id="hz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26345e" stop-opacity="0"/><stop offset="1" stop-color="#26345e" stop-opacity="0.7"/></linearGradient>
  </defs>

  <!-- ============ DATA ARCHIVE ============ -->
  <rect x="0" y="0" width="960" height="490" fill="url(#dark)"/>
  <text x="20" y="30" fill="#f5f7ff" font-size="18" font-weight="700">AFTER — Data Archive canyon, ground level (camera of g3_archive_ground.jpg)</text>
  <!-- vault ribs -->
  <g fill="none" stroke="#1f2c5c" stroke-width="12"><path d="M60 490 L60 120 Q480 30 900 120 L900 490"/><path d="M180 490 L180 160 Q480 90 780 160 L780 490"/></g>
  <!-- oculus -->
  <ellipse cx="480" cy="70" rx="90" ry="16" fill="#0d1530" stroke="#00e1ff" stroke-opacity="0.6"/>
  <polygon points="420,70 540,70 600,420 360,420" fill="#9fdcff" opacity="0.05"/>
  <!-- rack canyon walls left and right in perspective -->
  <polygon points="0,140 330,300 330,430 0,490" fill="#141c3c"/><polygon points="960,140 630,300 630,430 960,490" fill="#141c3c"/>
  <!-- rack units with small indicator lights -->
  <g stroke="#26345e" stroke-width="2"><line x1="60" y1="168" x2="60" y2="480"/><line x1="130" y1="202" x2="130" y2="468"/><line x1="200" y1="236" x2="200" y2="455"/><line x1="260" y1="266" x2="260" y2="444"/>
    <line x1="900" y1="168" x2="900" y2="480"/><line x1="830" y1="202" x2="830" y2="468"/><line x1="760" y1="236" x2="760" y2="455"/><line x1="700" y1="266" x2="700" y2="444"/></g>
  <g fill="#00e1ff"><circle cx="80" cy="260" r="2"/><circle cx="90" cy="300" r="2"/><circle cx="100" cy="340" r="2"/><circle cx="150" cy="280" r="2"/><circle cx="160" cy="330" r="2"/><circle cx="220" cy="300" r="2"/><circle cx="230" cy="350" r="2"/><circle cx="280" cy="320" r="2"/>
    <circle cx="880" cy="260" r="2"/><circle cx="870" cy="310" r="2"/><circle cx="810" cy="290" r="2"/><circle cx="800" cy="340" r="2"/><circle cx="740" cy="300" r="2"/><circle cx="730" cy="360" r="2"/><circle cx="680" cy="330" r="2"/></g>
  <g fill="#f5f7ff"><circle cx="110" cy="380" r="2"/><circle cx="170" cy="390" r="2"/><circle cx="850" cy="380" r="2"/><circle cx="790" cy="395" r="2"/></g>
  <!-- cooling stacks above rack tops -->
  <g fill="#0e1530"><rect x="20" y="60" width="40" height="110"/><rect x="900" y="60" width="40" height="110"/><rect x="150" y="110" width="30" height="100"/><rect x="780" y="110" width="30" height="100"/></g>
  <!-- cable trays overhead -->
  <g stroke="#3b4a7a" stroke-width="5"><line x1="0" y1="210" x2="420" y2="300"/><line x1="960" y1="210" x2="540" y2="300"/></g>
  <!-- rack-top walkways (T1) edge trims -->
  <g stroke="#00e1ff" stroke-width="2"><line x1="0" y1="140" x2="330" y2="300"/><line x1="960" y1="140" x2="630" y2="300"/></g>
  <!-- far end: vault wall with slot windows -->
  <rect x="330" y="300" width="300" height="130" fill="#111936"/>
  <g fill="#05080f"><rect x="370" y="310" width="12" height="90"/><rect x="420" y="310" width="12" height="90"/><rect x="528" y="310" width="12" height="90"/><rect x="578" y="310" width="12" height="90"/></g>
  <rect x="0" y="300" width="960" height="130" fill="url(#hz)"/>
  <!-- floor with grilles -->
  <polygon points="0,490 330,430 630,430 960,490" fill="#1a2348"/>
  <g stroke="#00e1ff" stroke-opacity="0.3"><line x1="480" y1="430" x2="480" y2="490"/><line x1="400" y1="445" x2="560" y2="445"/><line x1="300" y1="465" x2="660" y2="465"/></g>
  <!-- cover blocks kept -->
  <rect x="300" y="440" width="80" height="35" fill="#26345e"/><rect x="560" y="445" width="110" height="38" fill="#26345e"/>
  <g font-size="12" fill="#c9d1ea">
    <text x="580" y="60">open oculus keeps SUP_ARCHIVE drop clear to Y 160</text>
    <text x="20" y="100">cooling stacks (non-walkable)</text>
    <text x="690" y="230">cable trays ≥ Y 34 (decor)</text>
    <text x="370" y="295">vault wall, slot windows</text>
    <text x="20" y="480">rack faces: recessed units + small lights (no solid neon)</text>
  </g>

  <!-- ============ COOLANT RESERVOIR ============ -->
  <g transform="translate(0,510)">
    <rect x="0" y="0" width="960" height="490" fill="url(#dark)"/>
    <text x="20" y="30" fill="#f5f7ff" font-size="18" font-weight="700">AFTER — Coolant Reservoir rim, ground level (camera of g4_reservoir_ground.jpg)</text>
    <!-- hall wall + cooling towers behind -->
    <rect x="0" y="150" width="960" height="170" fill="#111936"/>
    <rect x="0" y="250" width="960" height="4" fill="#8a2be2" opacity="0.5"/>
    <!-- rev 2: lobby observation station set into the south wall notch -->
    <rect x="526" y="166" width="84" height="8" fill="#26345e"/>
    <rect x="530" y="174" width="76" height="20" fill="#9fdcff" opacity="0.22" stroke="#9fdcff" stroke-opacity="0.6"/>
    <rect x="530" y="194" width="76" height="3" fill="#00e1ff"/>
    <g stroke="#26345e" stroke-width="3"><line x1="540" y1="197" x2="552" y2="236"/><line x1="596" y1="197" x2="584" y2="236"/></g>
    <text x="568" y="160" fill="#c9d1ea" font-size="10" text-anchor="middle">lobby bay</text>
    <path d="M620 330 Q600 210 640 120 L730 120 Q770 210 750 330 Z" fill="#1f2c5c" stroke="#00e1ff" stroke-opacity="0.4"/>
    <path d="M780 330 Q768 240 795 180 L855 180 Q882 240 870 330 Z" fill="#1a2348" stroke="#00e1ff" stroke-opacity="0.4"/>
    <g fill="#9aa6c8" opacity="0.18"><ellipse cx="685" cy="110" rx="60" ry="18"/><ellipse cx="690" cy="85" rx="45" ry="14"/></g>
    <!-- pump hall (right) -->
    <polygon points="880,330 960,300 960,460 880,440" fill="#141c3c"/>
    <g fill="#26345e"><ellipse cx="910" cy="420" rx="18" ry="22"/></g>
    <rect x="0" y="220" width="960" height="110" fill="url(#hz)"/>
    <!-- bridges now with truss + piers -->
    <rect x="0" y="120" width="620" height="14" fill="#1f2c5c"/><line x1="0" y1="120" x2="620" y2="120" stroke="#8a2be2" stroke-width="2"/>
    <g stroke="#26345e" stroke-width="3"><line x1="40" y1="134" x2="80" y2="160"/><line x1="80" y1="160" x2="120" y2="134"/><line x1="120" y1="134" x2="160" y2="160"/><line x1="160" y1="160" x2="200" y2="134"/><line x1="200" y1="134" x2="240" y2="160"/><line x1="240" y1="160" x2="280" y2="134"/></g>
    <line x1="40" y1="160" x2="600" y2="160" stroke="#26345e" stroke-width="4"/>
    <!-- pump columns with flanges/valves -->
    <rect x="200" y="134" width="70" height="300" fill="#26345e"/>
    <g fill="#3b4a7a"><rect x="192" y="200" width="86" height="10"/><rect x="192" y="290" width="86" height="10"/><rect x="192" y="380" width="86" height="10"/></g>
    <circle cx="280" cy="250" r="12" fill="none" stroke="#00e1ff" stroke-width="3"/>
    <rect x="460" y="150" width="56" height="250" fill="#26345e"/>
    <g fill="#3b4a7a"><rect x="452" y="210" width="72" height="9"/><rect x="452" y="300" width="72" height="9"/></g>
    <!-- pipe rack -->
    <g stroke="#3b4a7a" stroke-linecap="round"><line x1="0" y1="350" x2="960" y2="340" stroke-width="16"/><line x1="0" y1="372" x2="960" y2="362" stroke-width="10"/></g>
    <g stroke="#1f2c5c" stroke-width="6"><line x1="120" y1="330" x2="120" y2="440"/><line x1="380" y1="328" x2="380" y2="440"/><line x1="640" y1="325" x2="640" y2="440"/></g>
    <!-- basin -->
    <polygon points="60,490 140,420 820,420 900,490" fill="#0a2a3a"/>
    <line x1="140" y1="420" x2="820" y2="420" stroke="#00e1ff" stroke-width="2"/>
    <g fill="#05080f"><rect x="300" y="425" width="40" height="12"/><rect x="600" y="425" width="40" height="12"/></g>
    <!-- rim railing -->
    <g stroke="#9aa6c8" stroke-opacity="0.7" stroke-width="2"><line x1="0" y1="440" x2="140" y2="412"/><line x1="0" y1="452" x2="140" y2="424"/></g>
    <g font-size="12" fill="#c9d1ea">
      <text x="640" y="105">cooling towers (outside flood volumes)</text>
      <text x="300" y="110">bridges get trusses + piers (no floating spans)</text>
      <text x="290" y="200">pump columns: flanges, valves, gauges</text>
      <text x="20" y="330">heavy pipe rack (decor)</text>
      <text x="320" y="470">basin keeps open sky for FLOOD; intake grates (decor)</text>
      <text x="790" y="290">pump hall</text>
    </g>
  </g>
</svg>
