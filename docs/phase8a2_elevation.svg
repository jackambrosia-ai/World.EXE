<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
  <!-- Phase 8A-2 proposed skyline: west-to-east elevation through the arena (not to exact scale; 1 px ~ 0.6 studs horizontally, 2 px ~ 1 stud vertically). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.7" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#16204a"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2be2" stop-opacity="0"/>
      <stop offset="1" stop-color="#8a2be2" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" fill="url(#sky)"/>
  <text x="480" y="28" fill="#f5f7ff" font-size="17" text-anchor="middle" font-weight="600">WORLD.EXE — Phase 8A-2 proposed skyline (west → east elevation)</text>
  <text x="480" y="46" fill="#9aa6c8" font-size="11" text-anchor="middle">Heights in studs above T0 (Y 0). Gameplay tiers unchanged: T0 0 · T1 24 · T2 48 · T3 72 · basin −10</text>

  <!-- distant backdrop megastructures (outside the arena bounds) -->
  <g fill="#141c3c" opacity="0.9">
    <rect x="20" y="150" width="40" height="300"/><rect x="70" y="210" width="30" height="240"/>
    <rect x="860" y="130" width="45" height="320"/><rect x="910" y="190" width="30" height="260"/>
    <rect x="110" y="250" width="25" height="200"/><rect x="820" y="240" width="28" height="210"/>
  </g>
  <g stroke="#00e1ff" stroke-opacity="0.35"><line x1="40" y1="150" x2="40" y2="450"/><line x1="882" y1="130" x2="882" y2="450"/></g>
  <text x="70" y="140" fill="#6f7ca8" font-size="10" text-anchor="middle">backdrop towers (decor, beyond bounds)</text>

  <!-- containment walls -->
  <rect x="140" y="210" width="10" height="240" fill="#26345e"/>
  <rect x="810" y="210" width="10" height="240" fill="#26345e"/>
  <g stroke="#00e1ff" stroke-width="2"><line x1="145" y1="210" x2="145" y2="450"/><line x1="815" y1="210" x2="815" y2="450"/></g>
  <text x="145" y="202" fill="#9aa6c8" font-size="10" text-anchor="middle">containment wall ~120</text>

  <!-- data floor far below + haze -->
  <rect x="0" y="470" width="960" height="90" fill="#0a0f1f"/>
  <g stroke="#00e1ff" stroke-opacity="0.25">
    <line x1="0" y1="490" x2="960" y2="490"/><line x1="0" y1="515" x2="960" y2="515"/><line x1="0" y1="540" x2="960" y2="540"/>
  </g>
  <rect x="0" y="380" width="960" height="100" fill="url(#haze)"/>
  <text x="480" y="555" fill="#6f7ca8" font-size="10" text-anchor="middle">luminous data floor ~Y −90 (decor, non-collidable; the −60 kill plane is unchanged)</text>

  <!-- T0 line -->
  <line x1="150" y1="450" x2="810" y2="450" stroke="#3b4a7a" stroke-width="3"/>
  <!-- substructure (supports under platforms) -->
  <g fill="#1a2348">
    <rect x="170" y="452" width="10" height="20"/><rect x="250" y="452" width="10" height="20"/><rect x="330" y="452" width="10" height="20"/>
    <rect x="610" y="452" width="10" height="20"/><rect x="700" y="452" width="10" height="20"/><rect x="780" y="452" width="10" height="20"/>
  </g>

  <!-- Research Yard: test hangar -->
  <path d="M160 450 L160 360 Q230 330 300 360 L300 450 Z" fill="#1f2c5c" stroke="#8a2be2" stroke-width="2"/>
  <text x="230" y="350" fill="#f5f7ff" font-size="11" text-anchor="middle">RESEARCH YARD</text>
  <text x="230" y="364" fill="#9aa6c8" font-size="9" text-anchor="middle">test hangar ~45, truss roof</text>

  <!-- Central Core: reactor -->
  <rect x="400" y="430" width="160" height="20" fill="#26345e"/>
  <rect x="410" y="402" width="140" height="6" fill="#1f2c5c"/>
  <rect x="455" y="150" width="50" height="300" fill="#2a2058" stroke="#8a2be2" stroke-width="2"/>
  <rect x="470" y="130" width="20" height="320" fill="#00e1ff" opacity="0.85"/>
  <g fill="#8a2be2"><rect x="440" y="320" width="80" height="6"/><rect x="440" y="250" width="80" height="6"/><rect x="440" y="180" width="80" height="6"/></g>
  <polygon points="430,450 455,300 455,450" fill="#1f2c5c"/><polygon points="530,450 505,300 505,450" fill="#1f2c5c"/>
  <rect x="445" y="120" width="70" height="12" fill="#26345e"/>
  <text x="480" y="112" fill="#f5f7ff" font-size="11" text-anchor="middle">CENTRAL CORE reactor ~160</text>
  <text x="480" y="98" fill="#9aa6c8" font-size="9" text-anchor="middle">buttresses, coil rings, crown, energy beam</text>

  <!-- Data Archive (north) shown as a silhouette behind the core -->
  <path d="M330 450 L330 330 Q380 300 430 330 L430 450 Z" fill="#18224a" opacity="0.8"/>
  <text x="365" y="322" fill="#9aa6c8" font-size="9" text-anchor="middle">Archive vault ~70 (behind)</text>

  <!-- Coolant Reservoir (south) cooling towers, in front -->
  <path d="M580 450 Q570 390 588 360 L622 360 Q640 390 630 450 Z" fill="#1f2c5c" stroke="#00e1ff" stroke-width="1"/>
  <path d="M520 450 Q512 400 527 380 L553 380 Q568 400 560 450 Z" fill="#1f2c5c" stroke="#00e1ff" stroke-width="1" opacity="0.85"/>
  <text x="605" y="350" fill="#9aa6c8" font-size="9" text-anchor="middle">cooling towers ~60–80 (front)</text>

  <!-- Skybridge: spires and deck -->
  <rect x="660" y="354" width="120" height="8" fill="#26345e"/>
  <rect x="690" y="230" width="18" height="124" fill="#1f2c5c" stroke="#8a2be2"/>
  <rect x="740" y="270" width="14" height="84" fill="#1f2c5c" stroke="#8a2be2"/>
  <rect x="680" y="300" width="40" height="6" fill="#2a2058"/>
  <line x1="699" y1="230" x2="699" y2="210" stroke="#00e1ff" stroke-width="2"/>
  <text x="720" y="200" fill="#f5f7ff" font-size="11" text-anchor="middle">SKYBRIDGE spires ~110</text>
  <text x="720" y="214" fill="#9aa6c8" font-size="9" text-anchor="middle">deck T2, relay pods T3</text>

  <!-- outer ring -->
  <g fill="#26345e"><rect x="165" y="402" width="30" height="5"/><rect x="765" y="402" width="30" height="5"/></g>
  <text x="180" y="398" fill="#9aa6c8" font-size="9" text-anchor="middle">ring T1</text>

  <!-- legend -->
  <g font-size="10" fill="#c9d1ea">
    <rect x="20" y="520" width="12" height="8" fill="#00e1ff"/><text x="38" y="528">cyan = system lines</text>
    <rect x="160" y="520" width="12" height="8" fill="#8a2be2"/><text x="178" y="528">violet = simulation/patch</text>
    <rect x="320" y="520" width="12" height="8" fill="#26345e"/><text x="338" y="528">navy = structure</text>
  </g>
</svg>
