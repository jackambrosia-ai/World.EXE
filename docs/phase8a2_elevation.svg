<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" font-family="Segoe UI, Arial, sans-serif">
  <!-- Phase 8A-2 rev 2: NORTH-SOUTH SECTION through x = 0, TO SCALE.
       Horizontal: x_svg = 560 + z (1 px = 1 stud). Vertical: y_svg = 430 - 1.4 * Y (vertical exaggeration 1.4x).
       North (-z) is on the left. Elements off the section plane are drawn faint and labelled "beyond". -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04060c"/><stop offset="1" stop-color="#101833"/></linearGradient>
  </defs>
  <rect width="1120" height="660" fill="url(#bg)"/>
  <text x="560" y="26" fill="#f5f7ff" font-size="17" font-weight="700" text-anchor="middle">WORLD.EXE Phase 8A-2 — north–south section at x = 0 (to scale, vertical ×1.4)</text>
  <text x="560" y="44" fill="#9aa6c8" font-size="11" text-anchor="middle">North ← → South (lobby). Tiers unchanged: T0 0 · T1 24 · T2 48 · T3 72 · basin −10</text>

  <!-- height ticks -->
  <g font-size="9" fill="#6f7ca8">
    <line x1="20" y1="94" x2="30" y2="94" stroke="#6f7ca8"/><text x="32" y="97">240</text>
    <line x1="20" y1="178" x2="30" y2="178" stroke="#6f7ca8"/><text x="32" y="181">180</text>
    <line x1="20" y1="164" x2="30" y2="164" stroke="#6f7ca8"/>
    <line x1="20" y1="346" x2="30" y2="346" stroke="#6f7ca8"/><text x="32" y="349">60</text>
    <line x1="20" y1="430" x2="30" y2="430" stroke="#6f7ca8"/><text x="32" y="433">0</text>
    <line x1="20" y1="514" x2="30" y2="514" stroke="#6f7ca8"/><text x="32" y="517">−60</text>
    <line x1="20" y1="556" x2="30" y2="556" stroke="#6f7ca8"/><text x="32" y="559">−90</text>
  </g>

  <!-- shaft floor, kill plane, T0 -->
  <rect x="40" y="556" width="1040" height="14" fill="#0a0f1f"/>
  <g stroke="#00e1ff" stroke-opacity="0.25"><line x1="40" y1="563" x2="1080" y2="563"/></g>
  <text x="560" y="590" fill="#6f7ca8" font-size="10" text-anchor="middle">shaft floor Y −90 (decor, non-collidable)</text>
  <line x1="40" y1="514" x2="1080" y2="514" stroke="#ff6b6b" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="110" y="510" fill="#ff8f8f" font-size="9">kill plane Y −60 (unchanged)</text>

  <!-- ArenaBounds -->
  <rect x="285" y="206" width="550" height="280" fill="none" stroke="#9aa6c8" stroke-opacity="0.35" stroke-dasharray="3 4"/>
  <text x="290" y="219" fill="#9aa6c8" font-size="9" opacity="0.8">ArenaBounds ±275, Y −40…160</text>

  <!-- far silhouettes (beyond, through deep windows) -->
  <g fill="#0c1228" opacity="0.9"><rect x="60" y="206" width="40" height="350"/><rect x="1020" y="206" width="40" height="350"/></g>

  <!-- terrace plinths z = ±320 to Y 60, terrace deck ±320..±400 -->
  <g fill="#1a2348">
    <rect x="234" y="346" width="12" height="210"/><rect x="874" y="346" width="12" height="210"/>
    <rect x="160" y="342" width="86" height="6"/><rect x="874" y="342" width="86" height="6"/>
  </g>
  <!-- terrace machinery towers (tops <= Y 150) -->
  <g fill="#141c3c" stroke="#26345e"><rect x="180" y="220" width="40" height="122"/><rect x="900" y="248" width="34" height="94"/></g>

  <!-- upper hall walls z = ±400, Y 60 -> 180 ; south wall notched at the lobby (Y 140 -> 180 open) -->
  <rect x="154" y="178" width="12" height="168" fill="#26345e"/>
  <rect x="954" y="234" width="12" height="112" fill="#26345e"/>
  <rect x="154" y="262" width="12" height="5" fill="#8a2be2" opacity="0.7"/>
  <line x1="160" y1="178" x2="160" y2="346" stroke="#00e1ff" stroke-opacity="0.5"/>

  <!-- ceiling ribs to hub ring Y 240 -->
  <g stroke="#1f2c5c" stroke-width="10"><line x1="160" y1="178" x2="530" y2="94"/><line x1="960" y1="178" x2="590" y2="94"/></g>
  <rect x="530" y="89" width="60" height="10" fill="#26345e"/>
  <text x="560" y="82" fill="#c9d1ea" font-size="10" text-anchor="middle">rib hub Y 240</text>
  <text x="300" y="128" fill="#9aa6c8" font-size="10">ceiling rib (Y 180 at wall → 240 at hub; ≥ Y 200 over every landing point)</text>

  <!-- Data Archive (north, z -260..-140) -->
  <rect x="300" y="396" width="120" height="34" fill="#1f2c5c"/>
  <g fill="#18224a"><rect x="300" y="332" width="8" height="98"/><rect x="412" y="332" width="8" height="98"/></g>
  <path d="M300 332 Q330 318 350 322" fill="none" stroke="#26345e" stroke-width="6"/><path d="M372 322 Q395 318 420 332" fill="none" stroke="#26345e" stroke-width="6"/>
  <text x="360" y="312" fill="#c9d1ea" font-size="10" text-anchor="middle">ARCHIVE vault Y 70, oculus</text>

  <!-- Outer ring T1 at z ±237 -->
  <g fill="#3b4a7a"><rect x="303" y="394" width="40" height="4"/><rect x="777" y="394" width="40" height="4"/></g>

  <!-- Skybridge spires (beyond, east side x 140-237) -->
  <g fill="#1f2c5c" opacity="0.45"><rect x="494" y="276" width="8" height="87"/><rect x="616" y="301" width="8" height="62"/></g>
  <rect x="420" y="363" width="280" height="4" fill="#3b4a7a" opacity="0.4"/>
  <text x="700" y="296" fill="#9aa6c8" font-size="9" opacity="0.8">Skybridge spires Y 110 / 92 (beyond, x≈190)</text>

  <!-- Central Core: plaza lid + pit to -90 -->
  <rect x="460" y="428" width="200" height="6" fill="#3b4a7a"/>
  <line x1="460" y1="428" x2="660" y2="428" stroke="#00e1ff" stroke-width="1.5"/>
  <g fill="#1a2348"><rect x="448" y="430" width="8" height="126"/><rect x="664" y="430" width="8" height="126"/></g>
  <g fill="#26345e"><rect x="456" y="472" width="14" height="3"/><rect x="650" y="472" width="14" height="3"/><rect x="456" y="514" width="14" height="3"/><rect x="650" y="514" width="14" height="3"/></g>
  <!-- canopy ring Y 60 at plaza edge -->
  <g fill="#26345e"><rect x="460" y="344" width="22" height="4"/><rect x="638" y="344" width="22" height="4"/></g>
  <g fill="#1a2348"><rect x="466" y="348" width="4" height="80"/><rect x="650" y="348" width="4" height="80"/></g>

  <!-- Reactor -->
  <rect x="530" y="402" width="60" height="154" fill="#1a2348"/>
  <g stroke="#26345e" stroke-width="2"><line x1="540" y1="402" x2="540" y2="556"/><line x1="580" y1="402" x2="580" y2="556"/></g>
  <polygon points="500,430 548,297 552,299 510,430" fill="#1f2c5c"/><polygon points="620,430 572,297 568,299 610,430" fill="#1f2c5c"/>
  <rect x="551" y="192" width="18" height="210" fill="#2a3a6a" opacity="0.6"/>
  <rect x="557" y="192" width="6" height="210" fill="#00e1ff"/>
  <g fill="#1f2c5c" stroke="#8a2be2" stroke-width="1"><rect x="536" y="355" width="48" height="10"/><rect x="540" y="292" width="40" height="10"/><rect x="544" y="229" width="32" height="10"/></g>
  <polygon points="546,192 574,192 580,164 540,164" fill="#26345e"/>
  <line x1="560" y1="164" x2="560" y2="99" stroke="#00e1ff" stroke-width="2" stroke-dasharray="4 3"/>
  <g font-size="10" fill="#f5f7ff">
    <text x="600" y="168">crown Y 190 (highest inside the wall line)</text>
    <text x="600" y="240">coils Y 140 / 95 / 50</text>
    <text x="600" y="455" fill="#9aa6c8">pit r 110 to Y −90, galleries −30 / −60</text>
  </g>

  <!-- Coolant Reservoir (south, z 140..260) -->
  <rect x="700" y="430" width="120" height="14" fill="#0a3a4a"/>
  <g fill="#26345e"><rect x="700" y="426" width="120" height="4"/></g>
  <g fill="#26345e"><rect x="740" y="382" width="10" height="48"/><rect x="775" y="382" width="10" height="48"/></g>
  <text x="760" y="372" fill="#c9d1ea" font-size="10" text-anchor="middle">RESERVOIR basin −10</text>
  <!-- cooling tower beyond (x ±150, z 298) -->
  <path d="M840 556 Q832 430 846 332 L870 332 Q884 430 876 556 Z" fill="#1f2c5c" opacity="0.5" stroke="#00e1ff" stroke-opacity="0.3"/>
  <text x="858" y="322" fill="#9aa6c8" font-size="9" text-anchor="middle">cooling tower Y −90→70 (beyond, x ±150)</text>

  <!-- Lobby observation pod in the south wall notch: floor Y 156-160, walls to 165, z 396-444 -->
  <rect x="956" y="206" width="48" height="6" fill="#3b4a7a"/>
  <rect x="956" y="199" width="3" height="7" fill="#9fdcff" opacity="0.8"/>
  <rect x="1001" y="199" width="3" height="7" fill="#26345e"/>
  <rect x="948" y="168" width="66" height="4" fill="#26345e"/>
  <g stroke="#26345e" stroke-width="4"><line x1="962" y1="212" x2="962" y2="260"/><line x1="998" y1="212" x2="966" y2="258"/></g>
  <text x="1010" y="190" fill="#f5f7ff" font-size="10">LOBBY</text>
  <text x="1010" y="202" fill="#9aa6c8" font-size="9">(0,160,410)</text>
  <text x="975" y="160" fill="#9aa6c8" font-size="9" text-anchor="middle">bay canopy Y 186</text>
  <text x="975" y="275" fill="#9aa6c8" font-size="9" text-anchor="middle">notch Y 140–180</text>
  <!-- sightlines from lobby eye (z 420, Y 161) -->
  <g stroke="#e6ecff" stroke-opacity="0.55" stroke-dasharray="5 4">
    <line x1="980" y1="205" x2="560" y2="164"/><line x1="980" y1="205" x2="560" y2="297"/><line x1="980" y1="205" x2="560" y2="430"/>
  </g>
  <text x="740" y="200" fill="#e6ecff" font-size="9" opacity="0.8">lobby sightlines → crown / mid-coil / base</text>

  <!-- labels for hall -->
  <g font-size="10" fill="#c9d1ea">
    <text x="166" y="172">upper wall ±400 → Y 180</text>
    <text x="250" y="378">plinth ±320 → Y 60</text>
    <text x="190" y="214" fill="#9aa6c8">terrace towers ≤ Y 150</text>
    <text x="62" y="200" fill="#9aa6c8">far silhouettes</text>
  </g>

  <!-- legend -->
  <g font-size="10" fill="#c9d1ea">
    <rect x="40" y="620" width="12" height="8" fill="#3b4a7a"/><text x="58" y="628">L1 playable (unchanged)</text>
    <rect x="210" y="620" width="12" height="8" fill="#1f2c5c"/><text x="228" y="628">L2 structure / reactor</text>
    <rect x="380" y="620" width="12" height="8" fill="#26345e"/><text x="398" y="628">L3 hall (decor)</text>
    <rect x="520" y="620" width="12" height="8" fill="#00e1ff"/><text x="538" y="628">cyan system</text>
    <rect x="640" y="620" width="12" height="8" fill="#8a2be2"/><text x="658" y="628">violet simulation</text>
    <text x="790" y="628" fill="#9aa6c8">faint = beyond the section plane</text>
  </g>
</svg>
